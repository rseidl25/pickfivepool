<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Picks</title>
  <script>(function(){var t=localStorage.getItem("pick5-theme");if(t!=="light"&&t!=="dark"&&t!=="original")t="original";document.documentElement.setAttribute("data-theme",t);})();</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="icons/favicon.png">

  <link rel="stylesheet" href="../src/css/m3-tokens.css?v=4">
  <link rel="stylesheet" href="../src/css/picks/picks.css?v=2">
</head>
<body>
  <div id="page-loading-overlay" class="page-loading-overlay">
    <div class="page-loading-spinner"></div>
  </div>

  <div class="app-shell">

    <header class="top-app-bar m3-top-app-bar">
      <div class="site-header-topbar">
        <img src="icons/PICK5LOGO_transparent.png" alt="Pick 5 Logo" class="brand-logo">
      </div>

      <div id="week-select-row" class="week-select-row">
        <span class="week-label">Select Week:</span>
        <div class="week-chip-row m3-scroll-x">
          <div id="week-nav" class="week-nav-chips"></div>
        </div>
        <button id="submit-btn" class="m3-btn m3-btn-filled" disabled>Next</button>
      </div>

      <div class="m3-menu-wrap" id="picks-menu-wrap">
        <button id="menu-trigger" type="button" class="m3-icon-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
          <span class="hamburger-bars"><span></span><span></span><span></span></span>
        </button>
        <div id="header-menu" class="m3-menu hidden">
          <button id="import-picks-menu-btn" type="button" class="m3-menu-item" style="display:none;">Import Picks</button>
          <button id="clear-picks-menu-btn" type="button" class="m3-menu-item">Clear All Picks</button>
          <div class="m3-menu-divider"></div>
          <a href="leagues.html" class="m3-menu-item">Back to Leagues</a>
        </div>
      </div>
    </header>

    <div id="league-player-row" class="league-player-row">
      <h1 id="week-title" class="week-title">WEEK 1</h1>
      <div class="player-info-stack">
        <span id="top-league-name" class="top-league-name"></span>
        <span id="top-user-display" class="top-user-display"></span>
      </div>
    </div>

    <div id="main-content" class="main-content">
      <div class="left-panel">
        <div id="matchups" class="matchups"></div>
      </div>

      <div class="sidebar">
        <div class="m3-card m3-card-elevated sidebar-panel">
          <div id="picks-box" class="picks-box">
            <h2>Your Picks (0/5)</h2>
            <div class="picks-progress-track"><div id="picks-progress-fill" class="picks-progress-fill"></div></div>
            <div id="picks-list" class="picks-list"></div>
            <p class="picks-hint">Select one of your picks as your <strong>Bonus Pick</strong></p>
          </div>
        </div>

        <div class="m3-card m3-card-elevated sidebar-panel">
          <div id="bonus-tracker" class="bonus-tracker">
            <h2>Bonus Tracker</h2>
          </div>
        </div>
      </div>
    </div>

    <div id="picks-drawer-backdrop" class="picks-drawer-backdrop"></div>
    <button id="picks-bottom-bar" type="button" class="picks-bottom-bar">
      <span id="picks-bottom-summary">🏈 Your Picks: 0/5</span>
      <span class="chevron">▲</span>
    </button>

    <div id="summary-screen" class="summary-screen hidden">
      <div id="summary-content" class="summary-content"></div>
    </div>
    <div id="summary-actions" class="summary-actions hidden">
      <button id="back-btn" class="m3-btn m3-btn-outlined">Back</button>
      <button id="final-submit-btn" class="m3-btn m3-btn-filled">Submit</button>
    </div>
  </div>

  <!-- Copy Picks From Another League -->
  <div id="copy-picks-modal" class="modal hidden">
    <div class="modal-content m3-dialog">
      <div class="modal-header">
        <h2>Copy Your Picks?</h2>
      </div>
      <div class="modal-body">
        <p class="modal-subtext">You've already submitted picks in another league this season. Want to copy them into this league instead of starting from scratch?</p>
        <div id="copy-picks-league-list" class="copy-picks-league-list"></div>
        <div class="copy-picks-actions">
          <button id="copy-picks-skip-btn" type="button" class="m3-btn m3-btn-outlined">Start Fresh</button>
          <button id="copy-picks-confirm-btn" type="button" class="m3-btn m3-btn-filled">Copy Picks</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Auth Guard -->
  <script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { app } from "../../src/js/auth/firebase_init.js";
    import { getSeasonConfig } from "../../src/js/util/api.js";

    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
      const season = await getSeasonConfig();
      if (season.locked) {
        window.location.href = "dashboard.html";
        return;
      }
      if (!user) {
        window.location.href = "login.html";
      }
    });
  </script>

  <script type="module" src="../src/js/picks/picks.js?v=2"></script>
  <script type="module" src="../src/js/picks/picks_firebase.js?v=1"></script>
  <script type="module" src="../src/js/auth/auth.js?v=1"></script>
</body>
</html>
