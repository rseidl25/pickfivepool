<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script>(function(){var t=localStorage.getItem("pick5-theme");if(t!=="light"&&t!=="dark"&&t!=="original")t="original";document.documentElement.setAttribute("data-theme",t);})();</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="icons/favicon.png">

  <link rel="stylesheet" href="../src/css/m3-tokens.css">
  <link rel="stylesheet" href="../src/css/auth/auth-form.css">
</head>
<body>
  <div class="hero">
    <div class="form-card m3-card m3-card-elevated">
      <img src="icons/PICK5LOGO_transparent.png" alt="Pick 5 Logo" class="form-logo">
      <h2 class="form-title">Create your account</h2>
      <form id="signup-form">
        <div class="m3-field-wrap">
          <input class="m3-field" type="text" id="signup-name" placeholder="Display Name" required>
        </div>
        <div class="m3-field-wrap">
          <input class="m3-field" type="email" id="signup-email" placeholder="Email" required>
        </div>
        <div class="m3-field-wrap">
          <input class="m3-field" type="password" id="signup-password" placeholder="Password" required>
        </div>
        <div class="m3-field-wrap">
          <input class="m3-field" type="password" id="confirm-password" placeholder="Confirm Password" required>
        </div>
        <button type="submit" class="m3-btn m3-btn-filled form-submit">Sign Up</button>
      </form>
      <a href="index.html" class="form-link back-link">Back to Home</a>
    </div>
  </div>

  <script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { app } from "../../src/js/auth/firebase_init.js";
    import { getSeasonConfig } from "../../src/js/util/api.js";

    const auth = getAuth(app);

    const unsubscribe = onAuthStateChanged(auth, async (user) => {
      unsubscribe();

      const season = await getSeasonConfig();
      if (season.locked) {
        window.location.href = "index.html";
        return;
      }

      if (user) {
        window.location.href = "dashboard.html";
      }
    });
  </script>

  <script type="module" src="../src/js/auth/auth.js"></script>
</body>
</html>
