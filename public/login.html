<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script>(function(){var t=localStorage.getItem("pick5-theme");if(t!=="light"&&t!=="dark"&&t!=="original")t="original";document.documentElement.setAttribute("data-theme",t);})();</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="icons/favicon.png">

  <link rel="stylesheet" href="../src/css/m3-tokens.css?v=11">
  <link rel="stylesheet" href="../src/css/auth/auth-form.css?v=2">
</head>
<body>
  <div class="hero">
    <div class="form-card m3-card m3-card-elevated">
      <img src="icons/PICK5LOGO_transparent.png" alt="Pick 5 Logo" class="form-logo">
      <h2 class="form-title">Welcome back</h2>
      <form id="login-form">
        <div class="m3-field-wrap">
          <input class="m3-field" type="email" id="login-email" placeholder="Email" required>
        </div>
        <div class="m3-field-wrap">
          <input class="m3-field" type="password" id="login-password" placeholder="Password" required>
        </div>
        <a href="#" id="forgot-password-link" class="form-link-forgot">Forgot password?</a>
        <button type="submit" class="m3-btn m3-btn-filled form-submit">Log In</button>
      </form>
      <a class="form-link" id="auth-link" href="signup.html">Don't have an account? Sign Up</a>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-password-modal" class="modal hidden">
    <div class="modal-content m3-dialog">
      <div class="modal-header">
        <h2>Reset Password</h2>
        <span class="close-btn" id="close-forgot-password">&times;</span>
      </div>
      <div class="modal-body">
        <div id="forgot-password-form-view">
          <p class="modal-subtext">Enter your account email and we'll send you a link to reset your password.</p>
          <form id="forgot-password-form">
            <div class="m3-field-wrap">
              <input class="m3-field" type="email" id="forgot-password-email" placeholder="Email" required>
            </div>
            <p id="forgot-password-error" class="form-error hidden"></p>
            <button type="submit" class="m3-btn m3-btn-filled">Send Reset Link</button>
          </form>
        </div>
        <div id="forgot-password-success-view" class="hidden">
          <p class="modal-subtext forgot-password-success-text">Check your inbox. We've sent a password reset link to <strong id="forgot-password-sent-email"></strong>.</p>
          <button type="button" id="forgot-password-done-btn" class="m3-btn m3-btn-filled">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../src/js/auth/auth.js?v=1"></script>
</body>
</html>
