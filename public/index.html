<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Pick 5</title>
  <script>(function(){var t=localStorage.getItem("pick5-theme");if(t!=="light"&&t!=="dark"&&t!=="original")t="original";document.documentElement.setAttribute("data-theme",t);})();</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="icons/favicon.png">

  <link rel="stylesheet" href="../src/css/m3-tokens.css">
  <link rel="stylesheet" href="../src/css/auth/index.css">
</head>
<body>
  <div class="hero" id="hero" style="display:none">
    <div class="hero-card m3-card m3-card-elevated">
      <img src="icons/PICK5LOGO_transparent.png" alt="Pick 5 Logo" class="hero-logo">
      <div class="hero-actions">
        <button id="signup-btn" class="m3-btn m3-btn-filled">Sign Up</button>
        <button onclick="window.location.href='login.html'" class="m3-btn m3-btn-outlined">Log In</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { app } from "../src/js/auth/firebase_init.js";
    import { authedFetch, getSeasonConfig } from "../src/js/util/api.js";

    const hero = document.getElementById("hero");
    function showHero() {
      hero.style.display = "flex";
    }

    // A returning, already-logged-in visitor skips the landing page entirely.
    // Before the season locks, leagues are still being set up/picks are
    // still in flux, so always send them to the league picker regardless of
    // league count. Only once the season is locked does the single-league
    // fast path (straight to that league's dashboard) kick in — otherwise
    // still the league picker for 0 or 2+ leagues. Guests (and anyone whose
    // leagues fail to load) fall through to the normal Sign Up / Log In
    // hero below.
    const auth = getAuth(app);
    const seasonPromise = getSeasonConfig();
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showHero();
        return;
      }
      try {
        const season = await seasonPromise;
        if (!season.locked) {
          window.location.href = "leagues.html";
          return;
        }
        const leagues = await authedFetch("/api/leagues/mine");
        if (leagues.length === 1) {
          localStorage.setItem("pick5_currentLeagueId", leagues[0].id);
          window.location.href = "dashboard.html";
        } else {
          window.location.href = "leagues.html";
        }
      } catch (err) {
        console.error("Error loading leagues:", err);
        showHero();
      }
    });

    const signupBtn = document.getElementById("signup-btn");

    const season = await seasonPromise;
    if (!season.locked) {
      signupBtn.onclick = () => window.location.href = "signup.html";
    } else {
      signupBtn.classList.add("disabled-btn");
      signupBtn.textContent = "Sign Up Closed";
    }
  </script>
</body>
</html>
